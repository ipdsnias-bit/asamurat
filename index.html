<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ASAMURAT BPS Kabupaten Nias</title>
  <meta name="description" content="Aplikasi Surat Menyurat BPS Kabupaten Nias: nomor surat keluar, nomor SK, surat masuk, dan disposisi.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f1e45">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EAS%3C/text%3E%3C/svg%3E">
  <style>
    /* Halaman pembungkus: aplikasi Apps Script tampil penuh layar di dalam iframe. */
    :root { --bg: #f3f5f9; --fg: #0f172a; --muted: #64748b; --card: #ffffff; --line: #e2e8f0; --brand: #1d4ed8; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0b1222; --fg: #e2e8f0; --muted: #94a3b8; --card: #111a2e; --line: #1f2a44; --brand: #60a5fa; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #0b1222; --fg: #e2e8f0; --muted: #94a3b8; --card: #111a2e; --line: #1f2a44; --brand: #60a5fa; color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 "Segoe UI", Roboto, Arial, sans-serif; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
    .status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px 16px; text-align: center; }
    .status[hidden] { display: none; }
    .box { max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
    .spin { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    .muted { color: var(--muted); }
    a.btn { display: inline-block; margin-top: 12px; padding: 9px 16px; border-radius: 9px; background: var(--brand); color: #fff; text-decoration: none; font-weight: 600; }
    a.btn:focus-visible { outline: 3px solid var(--line); outline-offset: 2px; }
  </style>
</head>
<body>
  <!-- GANTI dengan URL aplikasi web dari Apps Script (Terapkan → Kelola deployment → URL berakhiran /exec) -->
  <script>window.APP_URL = 'https://script.google.com/macros/s/AKfycbxc5oQLDF27f1rS93lnAZ8HBH_cOpLsTG4A7nPw1MUTndh-23MMZmGPXCx4eJ8z05iCkA/exec';</script>

  <div class="status" id="loading">
    <div class="box"><div class="spin"></div><b>Memuat ASAMURAT…</b>
      <div class="muted" id="slow" hidden>Butuh waktu lebih lama dari biasanya.<br>
        <a class="btn" id="open1" href="#" target="_blank" rel="noopener">Buka di tab baru</a></div>
    </div>
  </div>
  <div class="status" id="unset" hidden>
    <div class="box"><b>Link aplikasi belum diatur</b>
      <p class="muted">Isi <code>APP_URL</code> di file <code>index.html</code> dengan URL aplikasi web Apps Script (berakhiran <code>/exec</code>).</p></div>
  </div>

  <iframe id="app" title="ASAMURAT BPS Kabupaten Nias" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade" hidden></iframe>

  <script>
    (function () {
      var url = window.APP_URL;
      var loading = document.getElementById('loading');
      if (!url || url.indexOf('GANTI_DENGAN') >= 0) {
        loading.hidden = true;
        document.getElementById('unset').hidden = false;
        return;
      }
      document.getElementById('open1').href = url;
      var frame = document.getElementById('app');
      frame.addEventListener('load', function () { loading.hidden = true; frame.hidden = false; });
      // jika lama tidak termuat (koneksi lambat / diblokir browser), tawarkan membuka langsung
      setTimeout(function () { if (!loading.hidden) document.getElementById('slow').hidden = false; }, 12000);
      frame.src = url;
    })();
  </script>
</body>
</html>
